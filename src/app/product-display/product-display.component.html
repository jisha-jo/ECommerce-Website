<div class="container bg-light"> 
  
<div class="row">
  <div class="col-lg-1 col-md-12" ><small>Sort By:</small></div>
  <div class="sorts col-lg-2 col-md-12" style="cursor:pointer" (click)="setSortCategory('price', 'asec')"><small>Price-Low To High</small></div>
  <div class=" sorts col-lg-2 col-md-12" style="cursor:pointer" (click)="setSortCategory('price','desc')"><small>Price-High to Low</small></div>
  <div class="sorts col-lg-2 col-md-12" style="cursor:pointer" (click)="setSortCategory('rating', 'none')" ><small>Ratings</small></div>
  <div class="gx-3 col-lg-5 ms-auto">
    <!-- <input [(ngModel)]='Title' class="form-control col-lg-8"  type="text" placeholder="Search by Title...." aria-label="Search">
  <button class="col-lg-2 btn btn-primary btn-sm" (click)="search()"><i class="fas fa-search"></i></button> -->
  <div class="input-group ms-auto">
    <div class="form-outline"  style="float: right;">
      <input [(ngModel)]='Title' type="search" class="form-control" placeholder="Search Title..." />
    </div>
    <button type="button" class="btn btn-primary" (click)="search()" >
      <i class="fas fa-search"></i>
    </button>
  </div>
  </div>
    
  
</div>
</div> 
<!--  -->
<div class="container bg-light">
  <div class="row mt-2">
    <div *ngFor="let item of products?.products|sort:[sortField, sortDirection]|filter:[searchTitle,'title']" class="col col-sm-8 col-md-6 col-lg-4 mt-3">
        <div class="card h-100" style="width: 18rem;">
          <img style="width:100%;height: 100px;object-fit:cover" src={{item.thumbnail}} class="card-img-top" alt="Product Image">
          <div class="card-body">
            <h5 class="card-title">{{item.title}}</h5>
            <p class="card-text">{{item.price | currency:'USD'}}</p>
            <p class="card-text"><i class="fa-solid fa-star" style="color: #ffde0a;"></i> {{item.rating}}</p>
            <p class="card-text">{{item.description}}</p>
            <a href="#" class="btn btn-primary" (click)="sendProduct(item)" [routerLink] ="['/product_display', item.id]">Add To Cart</a>
          </div>
        </div>
    </div>
  </div>
</div>
