<div class="container bg-light mb-2" >
  <h3 (click)="sendCategory('smartphones')" style="font-weight: 300; cursor: pointer;">Best of Smartphones</h3> 
  <div class="card-group card-group-scroll" *ngFor="let item of categoriesListArray">
    <ng-container *ngFor="let item of item.products" >
      <div class="card h-200" (click)="sendProduct(item)" [routerLink] ="['/product_display', item.id]" style=" cursor: pointer;" >
        <img src={{item.thumbnail}} class="card-img-top" style="width:100%;height:200px;object-fit:cover" alt="Hollywood Sign on The Hill" />
        <div class="card-body">
            <h5 class="card-title">{{item.title}}</h5>
        </div>
    </div>
    </ng-container> 
  </div>
</div>
