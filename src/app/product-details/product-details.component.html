<div class="container bg-light mt-5" style="height: 50%;">

  <div class = "row">
    <div class = "col-sm-12 col-md-12 col-lg-6 mb-5 mb-lg-0">

      <div id="demo" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
           <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
           <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
           <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
           <div class="carousel-item active">
              <img src="{{product?.images[0]}}" alt="Image 1" style="width: 100%; height:100%;display:block; object-fit: cover; ">
           </div>
           <div class="carousel-item">
              <img src="{{product?.images[1]}}" alt="Image 2" style="width: 100%; display:block; object-fit: cover;">
           </div>
           <div class="carousel-item" >
              <img src="{{product?.images[2]}}" alt="Image" style="width: 100%; display:block; object-fit: cover;">
           </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        </button>
     </div> 
    
    </div>

     <div class = "col-sm-12 col-md-12 col-lg-6">


      <p class="display-6 fw-bold">
        {{product?.title}}
      </p>
      <div class="display-7">
        Brand: {{product?.brand}}
      </div>
      <div class="display-7">
        <span class="glyphicon glyphicon-star"></span> Ratings: {{product?.rating}} stars
      </div>
      <hr>
      <div class="mb-2">
        <span class="display-7" style="color: red;">{{product?.discountPercentage}} %</span><span class="display-6" > &nbsp; {{product?.price | currency:'USD' }}</span>
      </div>
      <p class="display-7">
        {{product?.description}}
      </p>

        <div class="row mt-3">
          <div class="col-lg-6 col-md-12 col-sm-12 mb-3">
             <button class="btn btn-primary" (click)="addToCart(product)">Add to Cart</button>
            <!-- <button class="btn btn-primary" (click)="sendProductToCart(product)" >Add to Cart</button> -->
          </div>
          <div class="col-lg-6 col-md-12 col-sm-12" >
            <button class="btn btn-warning">Buy Now</button>
          </div>
        </div>
     </div>
  </div>
</div>
